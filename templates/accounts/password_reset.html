{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="section"><div class="container" style="max-width:520px">
  <form class="card" method="post" novalidate>{% csrf_token %}
    <h1>Reset your password</h1>
    <p class="muted">Enter the email address you registered with. We'll send you a link to choose a new password.</p>
    {% include "includes/form.html" %}
    <div class="form-actions"><button class="btn btn-primary" type="submit">Send reset link</button><a href="{% url 'accounts:login' %}">Back to sign in</a></div>
  </form>
</div></section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<section class="section"><div class="container" style="max-width:520px"><div class="card">
  <h1>Check your email</h1>
  <p>If an account exists for that address, we've sent a link to reset your password. It may take a few minutes to arrive. Check your spam folder too.</p>
  <a class="btn btn-primary" href="{% url 'accounts:login' %}">Back to sign in</a>
</div></div></section>
{% endblock %}

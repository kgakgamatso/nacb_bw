{% extends "base.html" %}
{% block title %}{{ T.login }}{% endblock %}
{% block content %}
<section class="section"><div class="container" style="max-width:480px">
  <form class="card" method="post" novalidate>{% csrf_token %}
    <h1>Sign in</h1>
    <p class="muted">Access your dashboard, applications and registration.</p>
    <input type="hidden" name="next" value="{{ next }}">
    {% include "includes/form.html" %}
    <div class="form-actions"><button class="btn btn-primary" type="submit">Sign in</button><a href="{% url 'accounts:password_reset' %}">Forgot your password?</a></div>
    <p class="mt-2 mb-0 small">New to NACB? <a href="{% url 'accounts:signup' %}">Create an account</a></p>
  </form>
</div></section>
{% endblock %}
